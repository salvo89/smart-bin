<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Barra LED Smart Bin  5 cassonetti (senza vetro).
  Fori LED su posizioni alternate (uno sì uno no) per saldare comodo con il ferro.
  Indice firmware: 0 Carta, 1 Organico, 2 Indiff., 3 Plastica, 4 Verde.

  Foro LED: ø3.2 mm (r=1.6). Passo lungo asse 16 mm (slot vuoto 8 mm tra un LED e l'altro).
  Pari (0,2,4) leggermente in alto; dispari (1,3) in basso ’ accesso alternato ai pad.

  Stroke: nero = contorno; blu = foro passante; rosso = incisione etichette (convertire in tracciato in Inkscape).
-->
<svg
   width="90mm"
   height="22mm"
   viewBox="0 0 90 22"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Smart Bin  barra LED (5, senza vetro)</title>
  <defs>
    <style type="text/css"><![CDATA[
      .cut-out { fill: none; stroke: #000000; stroke-width: 0.05; stroke-linecap: square; stroke-linejoin: miter; }
      .cut-in  { fill: none; stroke: #0000ff; stroke-width: 0.05; stroke-linecap: square; stroke-linejoin: miter; }
      .engrave { fill: none; stroke: #ff0000; stroke-width: 0.12; stroke-linecap: round; stroke-linejoin: round; }
      .label { font-family: sans-serif; font-size: 2.2px; fill: #ff0000; stroke: none; }
    ]]></style>
  </defs>
  <g id="led-bar">
    <rect class="cut-out" x="0" y="0" width="82" height="12" rx="1" ry="1" />
    <!-- 0 Carta -->
    <circle id="led-hole-0" class="cut-in" cx="5" cy="4.5" r="1.6" />
    <text class="label" x="5" y="10.5" text-anchor="middle">Car</text>
    <!-- 1 Organico -->
    <circle id="led-hole-1" class="cut-in" cx="21" cy="7.5" r="1.6" />
    <text class="label" x="21" y="10.5" text-anchor="middle">Org</text>
    <!-- 2 Indifferenziata -->
    <circle id="led-hole-2" class="cut-in" cx="37" cy="4.5" r="1.6" />
    <text class="label" x="37" y="10.5" text-anchor="middle">Ind</text>
    <!-- 3 Plastica -->
    <circle id="led-hole-3" class="cut-in" cx="53" cy="7.5" r="1.6" />
    <text class="label" x="53" y="10.5" text-anchor="middle">Pla</text>
    <!-- 4 Verde (non vetro) -->
    <circle id="led-hole-4" class="cut-in" cx="69" cy="4.5" r="1.6" />
    <text class="label" x="69" y="10.5" text-anchor="middle">Ver</text>
  </g>
</svg>
