<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Micro raccolta: pannelli cassonetto svasato, lamellare/compensato 3 mm.
  Pettini: passo 10 mm, profondita 3 mm; angoli 4 mm retti prima dei denti.
  Fronte/retro: femmina sui lati lunghi; bordo superiore dritto; in basso una sola tacca femmina centrata (allineata al dente base 44 mm).
  Lati A/B: maschio sui lati lunghi; in basso una sola tacca femmina centrata (38 mm).
  Base: 44 x 38 mm (50-2t e 44-2t, t=3 mm), un solo dente maschio centrato per lato.
  Ruote (x2): strato 1 = solo cerchio base; strato 2 = anello (bordo) + cerchio mozzo centrale (incollare sopra).
  Coperchio: base 65 mm + inserti + riquadro (~52.5%/67.5% inserto) + triangoli (layout sotto le ruote).

  Stroke: nero = taglio esterno; rosso = incisione; blu = taglio interno.
-->

