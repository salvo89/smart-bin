# Escilo — sito statico da docs/
# Publish directory: cartella docs/ (non la root del repo).
# Push: Netlify Functions in netlify/functions/ (env: VAPID_*, DISPATCH_SECRET).

[build]
  publish = "docs"
  command = "npm install && python3 tools/build_seo_pages.py"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["docs/calendars/**"]

[[redirects]]
  from = "/api/push/subscribe"
  to = "/.netlify/functions/push-subscribe"
  status = 200

[[redirects]]
  from = "/api/push/unsubscribe"
  to = "/.netlify/functions/push-unsubscribe"
  status = 200

[[redirects]]
  from = "/api/push/dispatch"
  to = "/.netlify/functions/push-dispatch"
  status = 200

[[redirects]]
  from = "/api/push/vapid-public"
  to = "/.netlify/functions/push-vapid-public"
  status = 200

# PWA: service worker e manifest non devono restare in cache aggressiva.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/javascript; charset=utf-8"
    Service-Worker-Allowed = "/"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

# Calendari .h letti come testo dal browser
[[headers]]
  for = "/calendars/*.h"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Indici JSON (index / sources / sources-lite): cache CDN 1h
[[headers]]
  for = "/calendars/*.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# SEO / agent discovery
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/comuni/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
