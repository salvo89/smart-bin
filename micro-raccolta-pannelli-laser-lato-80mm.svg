<!--
  Duplicato di micro-raccolta-pannelli-laser.svg: altezza lati 80 mm (-30 mm rispetto a 110 mm). (Se serviva 89 mm, rigenerare con HEIGHT=89 in gen_finger_paths.py e ricalcolare il coperchio come sotto.)
  (In scala mm del progetto; se serviva una riduzione in cm, adattare HEIGHT in tools/gen_finger_paths.py.)

  Pettini: passo 10 mm, profondita 3 mm, angoli 4 mm invariati; solo il numero di denti si adatta all'altezza.
  Svasatura e vano/coperchio: proporzioni come il file 110 mm (riferimento altezza 110 mm).
  Base 44x38 mm invariata (stessa base del modello originale).
  Ruote (x2): strato 1 = solo disco base; strato 2 = corona + mozzo (stesse proporzioni del file 110 mm, × 80/110).

  Generazione path: py -3 tools/gen_finger_paths.py 80

  Stroke: nero = taglio esterno; rosso = incisione; blu = taglio interno.
-->

