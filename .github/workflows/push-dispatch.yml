# Dispatch orario notifiche push Escilo (Web Push).
# Secrets richiesti sul repo:
#   DISPATCH_SECRET — stesso valore di Netlify env DISPATCH_SECRET
#   SITE_URL — es. https://tuosito.netlify.app

name: push-dispatch

on:
  schedule:
    # TEST: ogni 5 minuti. In prod: ripristinare `5 * * * *` (ogni ora).
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Call Netlify push-dispatch
        env:
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_SECRET:-}" ] || [ -z "${SITE_URL:-}" ]; then
            echo "Missing DISPATCH_SECRET or SITE_URL secrets" >&2
            exit 1
          fi
          BASE="${SITE_URL%/}"
          curl -fsS -X POST \
            -H "Content-Type: application/json" \
            -H "X-Dispatch-Secret: ${DISPATCH_SECRET}" \
            "${BASE}/api/push/dispatch"
