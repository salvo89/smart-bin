# Backup orario notifiche push Escilo (Web Push).
# Trigger primario consigliato: cron-job.org → POST /api/push/dispatch
# (GitHub schedule è best-effort e può saltare ore intere).
# Secrets richiesti sul repo:
#   DISPATCH_SECRET — stesso valore di Netlify env DISPATCH_SECRET
#   SITE_URL — es. https://tuosito.netlify.app

name: push-dispatch

on:
  schedule:
    # Backup ogni ora (minuto 17, offset per ridurre coda :00/:05).
    - cron: "17 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Secret creati sotto Settings → Environments → Nitlify
    environment: Nitlify
    steps:
      - name: Call Netlify push-dispatch
        env:
          DISPATCH_SECRET: ${{ secrets.DISPATCH_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_SECRET:-}" ] || [ -z "${SITE_URL:-}" ]; then
            echo "Missing DISPATCH_SECRET or SITE_URL secrets" >&2
            exit 1
          fi
          BASE="${SITE_URL%/}"
          RESP="$(curl -sS -w "\n%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -H "X-Dispatch-Secret: ${DISPATCH_SECRET}" \
            "${BASE}/api/push/dispatch")"
          BODY="$(echo "$RESP" | sed '$d')"
          CODE="$(echo "$RESP" | tail -n 1)"
          echo "$BODY"
          if [ "$CODE" != "200" ]; then
            echo "HTTP $CODE" >&2
            exit 1
          fi
