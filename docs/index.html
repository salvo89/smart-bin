<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1f5c42" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Smart Bin" />
  <title>Smart Bin — Calendario</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #eef6f1;
      --bg-top: #d8f0e2;
      --surface: #ffffff;
      --ink: #142018;
      --muted: #5a7266;
      --muted-2: #6a8074;
      --line: #d5e2da;
      --accent: #1f5c42;
      --accent-soft: #e4f3eb;
      --safe: 1rem;
      --touch: 2.75rem;
      --nav-h: 4.25rem;
      --font: "Outfit", "Segoe UI", system-ui, sans-serif;
      --display: "Fraunces", Georgia, serif;
      --tag-c: #5a9fd4;
      --tag-o: #8b5a3c;
      --tag-i: #8a95a5;
      --tag-p: #d4a017;
      --tag-v: #3fad6a;
      --tag-car: #4a7ec8;
      --tag-x: #a88bc8;
    }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: var(--font);
      color: var(--ink);
      line-height: 1.4;
      background:
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg) 28%, #f4f7f5 100%);
    }
    button {
      font: inherit;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      border: none;
      background: none;
    }

    .app {
      max-width: 28rem;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.75rem var(--safe) 0.5rem;
      padding-top: max(0.75rem, env(safe-area-inset-top));
    }
    .brand {
      font-family: var(--display);
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 0;
    }
    .brand-sub {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }

    .panel {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 0.85rem;
      padding: 0.35rem var(--safe) 1.25rem;
    }
    .panel.active { display: flex; }
    #panelCal {
      padding-top: 0.65rem;
      gap: 1rem;
    }

    .hero {
      position: relative;
      padding: 1.25rem 1.15rem 1.2rem;
      border-radius: 1.5rem;
      background: linear-gradient(145deg, #1f5c42 0%, #2a7a58 48%, #1a4a36 100%);
      color: #f3faf6;
      box-shadow: 0 12px 28px rgba(26, 74, 54, 0.28);
      overflow: hidden;
      animation: rise 0.5s ease both;
    }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }
    .eyebrow {
      margin: 0 0 0.3rem;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      opacity: 0.75;
    }
    .hero h2 {
      margin: 0 0 0.15rem;
      font-family: var(--display);
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }
    .hero .when {
      margin: 0 0 1rem;
      font-size: 0.85rem;
      opacity: 0.78;
    }
    .pickup-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .pickup {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-height: var(--touch);
      padding: 0.65rem 0.8rem;
      border-radius: 1rem;
      background: rgba(255, 255, 255, 0.12);
    }
    .pickup .swatch {
      width: 0.55rem;
      height: 1.7rem;
      border-radius: 999px;
      flex-shrink: 0;
    }
    .pickup .name { flex: 1; font-weight: 650; font-size: 0.98rem; }
    .hero.empty .pickup-list,
    .hero.street .pickup-list { display: none; }
    .hero-empty,
    .hero-street {
      display: none;
      padding: 0.2rem 0 0;
    }
    .hero.empty .hero-empty,
    .hero.street .hero-street { display: block; }
    .hero-empty p,
    .hero-street p {
      margin: 0;
      font-size: 0.95rem;
      opacity: 0.85;
    }
    .hero-street strong { color: #ffe08a; font-weight: 650; }

    .week-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 0.25rem 0.1rem 0;
    }
    .week-head h2 {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 700;
    }
    .week-head span {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--muted);
    }
    .week-scroll {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      padding: 0.1rem 0.05rem 0.25rem;
      scrollbar-width: none;
    }
    .week-scroll::-webkit-scrollbar { display: none; }
    .day-chip {
      flex: 0 0 3.85rem;
      scroll-snap-align: start;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.2rem;
      min-height: 4.8rem;
      padding: 0.55rem 0.3rem 0.5rem;
      border-radius: 1.1rem;
      background: var(--surface);
      border: 1.5px solid transparent;
      color: var(--ink);
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .day-chip .dow {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted-2);
    }
    .day-chip .num {
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1;
    }
    .day-chip .dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      min-height: 0.4rem;
      margin-top: 0.1rem;
    }
    .day-chip .dot-bin {
      width: 0.38rem;
      height: 0.38rem;
      border-radius: 50%;
    }
    .day-chip.today { border-color: rgba(31, 92, 66, 0.35); }
    .day-chip.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .day-chip.selected .dow { color: rgba(255, 255, 255, 0.7); }

    .day-detail {
      padding: 0.75rem 0.85rem;
      border-radius: 1rem;
      background: var(--surface);
      min-height: 3.2rem;
    }
    .day-detail .label {
      margin: 0 0 0.4rem;
      font-size: 0.7rem;
      font-weight: 650;
      color: var(--muted-2);
    }
    .day-detail .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.35rem 0.55rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 650;
      background: #f0f5f2;
      border: 1px solid var(--line);
    }
    .chip .mark {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .chip.sw-c {
      background: color-mix(in srgb, var(--tag-c) 16%, white);
      border-color: color-mix(in srgb, var(--tag-c) 40%, transparent);
    }
    .chip.sw-o {
      background: color-mix(in srgb, var(--tag-o) 16%, white);
      border-color: color-mix(in srgb, var(--tag-o) 40%, transparent);
    }
    .chip.sw-i {
      background: color-mix(in srgb, var(--tag-i) 18%, white);
      border-color: color-mix(in srgb, var(--tag-i) 40%, transparent);
    }
    .chip.sw-p {
      background: color-mix(in srgb, var(--tag-p) 18%, white);
      border-color: color-mix(in srgb, var(--tag-p) 42%, transparent);
    }
    .chip.sw-v {
      background: color-mix(in srgb, var(--tag-v) 16%, white);
      border-color: color-mix(in srgb, var(--tag-v) 40%, transparent);
    }
    .chip.sw-car {
      background: color-mix(in srgb, var(--tag-car) 16%, white);
      border-color: color-mix(in srgb, var(--tag-car) 40%, transparent);
    }
    .chip.sw-x {
      background: color-mix(in srgb, var(--tag-x) 16%, white);
      border-color: color-mix(in srgb, var(--tag-x) 40%, transparent);
    }
    .day-detail .empty-day {
      margin: 0;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .month-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: var(--touch);
      padding: 0 1rem;
      border-radius: 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      font-weight: 650;
      font-size: 0.88rem;
      color: var(--accent);
    }
    .month-link .hint {
      color: var(--muted-2);
      font-weight: 500;
      font-size: 0.75rem;
    }

    .cal-wrap {
      display: flex;
      flex-direction: column;
      gap: 1.15rem;
    }
    .cal-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }
    .cal-title {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      font-family: var(--display);
    }
    .cal-nav { display: flex; gap: 0.3rem; flex-wrap: wrap; }
    .cal-nav button {
      min-height: 2.2rem;
      min-width: 2.2rem;
      padding: 0.35rem 0.65rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .cal-body {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .cal-legend {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.55rem 0.85rem;
      padding: 0.15rem 0.4rem 0;
    }
    .cal-legend > span {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.28rem;
      min-width: 2.6rem;
    }
    .cal-legend i {
      display: block;
      width: 1.35rem;
      height: 0.45rem;
      border-radius: 999px;
      font-style: normal;
      font-size: 0;
      overflow: hidden;
    }
    .cal-legend .name {
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--muted);
      text-align: center;
      line-height: 1.15;
    }
    .cal-legend i.tag-c { background: var(--tag-c); }
    .cal-legend i.tag-o { background: var(--tag-o); }
    .cal-legend i.tag-i { background: var(--tag-i); }
    .cal-legend i.tag-p { background: var(--tag-p); }
    .cal-legend i.tag-v { background: var(--tag-v); }
    .cal-legend i.tag-car { background: var(--tag-car); }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 3px;
    }
    .cal-dow {
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted-2);
      text-align: center;
      padding: 0.3rem 0;
    }
    .cal-cell {
      min-height: 3.2rem;
      border-radius: 0.55rem;
      background: var(--surface);
      padding: 0.22rem 0.25rem 0.3rem;
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      border: 1px solid transparent;
    }
    .cal-cell.pad {
      background: transparent;
      min-height: 0;
      padding: 0;
    }
    .cal-cell.today {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .cal-cell .num {
      font-size: 0.68rem;
      font-weight: 650;
      color: var(--muted-2);
      line-height: 1;
    }
    .cal-cell .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      flex: 1;
      align-content: flex-start;
    }
    .cal-cell .tag {
      font-size: 0.48rem;
      font-weight: 800;
      padding: 0.1rem 0.24rem;
      border-radius: 3px;
      color: #0a0e12;
      line-height: 1.1;
      white-space: nowrap;
    }
    .cal-cell .tag-c { background: var(--tag-c); }
    .cal-cell .tag-o { background: var(--tag-o); color: #fff4ec; }
    .cal-cell .tag-i { background: var(--tag-i); color: #1a222c; }
    .cal-cell .tag-p { background: var(--tag-p); color: #1a222c; }
    .cal-cell .tag-v { background: var(--tag-v); color: #0a0e12; }
    .cal-cell .tag-x { background: var(--tag-x); color: #0a0e12; }
    .cal-cell .tag-car { background: var(--tag-car); color: #f4f8ff; }
    .cal-cell .none {
      font-size: 0.55rem;
      color: var(--muted);
      opacity: 0.6;
    }

    .sw-c { background: var(--tag-c); }
    .sw-o { background: var(--tag-o); }
    .sw-i { background: var(--tag-i); }
    .sw-p { background: var(--tag-p); }
    .sw-v { background: var(--tag-v); }
    .sw-car { background: var(--tag-car); }
    .sw-x { background: var(--tag-x); }

    .bottom-nav {
      position: fixed;
      left: 50%;
      bottom: max(0.65rem, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: min(calc(100% - 1.3rem), 26.7rem);
      z-index: 30;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.25rem;
      padding: 0.35rem;
      border-radius: 1.35rem;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(20, 40, 30, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.95);
    }
    .bottom-nav button {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.45rem 0.2rem;
      border-radius: 1rem;
      font-size: 0.65rem;
      font-weight: 650;
      color: var(--muted-2);
      transition: background 0.15s, color 0.15s;
    }
    .bottom-nav button svg {
      width: 1.25rem;
      height: 1.25rem;
    }
    .bottom-nav button.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .live-line {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1 class="brand">Smart Bin</h1>
        <p class="brand-sub">Calendario ritiri</p>
      </div>
    </header>
    <span class="live-line" id="liveLine">Calendario ritiri</span>

    <section class="panel active" id="panelHome" data-panel="home" aria-label="Home">
      <section class="hero" id="hero" aria-labelledby="heroTitle">
        <p class="eyebrow">Domani</p>
        <h2 id="heroTitle">—</h2>
        <p class="when" id="heroWhen">—</p>
        <div class="pickup-list" id="heroPickups"></div>
        <div class="hero-empty">
          <p>Nessun ritiro in calendario. Puoi lasciare i cassonetti a casa.</p>
        </div>
        <div class="hero-street">
          <p><strong>Pulizia Strada</strong> — nessun cassonetto in strada.</p>
        </div>
      </section>

      <div class="week-head">
        <h2 id="weekTitle">Questa settimana</h2>
        <span id="weekMonthHint">—</span>
      </div>
      <div class="week-scroll" id="weekStrip" role="listbox" aria-label="Giorni della settimana"></div>
      <div class="day-detail" id="dayDetail" aria-live="polite">
        <p class="label" id="dayDetailLabel">—</p>
        <div class="chips" id="dayDetailChips"></div>
      </div>

      <button type="button" class="month-link" id="btnGotoCal">
        Calendario mensile
        <span class="hint" id="calTitleShort">—</span>
      </button>
    </section>

    <section class="panel" id="panelCal" data-panel="cal" aria-label="Calendario">
      <div class="cal-wrap" id="calWrap">
        <div class="cal-toolbar">
          <p class="cal-title" id="calTitle">—</p>
          <div class="cal-nav">
            <button type="button" id="btnCalPrev" aria-label="Mese precedente">←</button>
            <button type="button" id="btnCalToday" title="Vai al mese corrente">Oggi</button>
            <button type="button" id="btnCalNext" aria-label="Mese successivo">→</button>
          </div>
        </div>
        <div class="cal-body">
          <div class="cal-grid" id="calGridHead" aria-hidden="true"></div>
          <div class="cal-grid" id="calGrid" role="grid" aria-label="Calendario ritiri"></div>
        </div>
        <div class="cal-legend" aria-label="Legenda rifiuti">
          <span><i class="tag-c" aria-hidden="true"></i><span class="name">Carta</span></span>
          <span><i class="tag-o" aria-hidden="true"></i><span class="name">Organico</span></span>
          <span><i class="tag-i" aria-hidden="true"></i><span class="name">Indiff.</span></span>
          <span><i class="tag-p" aria-hidden="true"></i><span class="name">Plastica</span></span>
          <span><i class="tag-v" aria-hidden="true"></i><span class="name">Verde</span></span>
        </div>
      </div>
    </section>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Sezioni">
    <button type="button" class="active" data-tab="home" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
      Home
    </button>
    <button type="button" data-tab="cal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 9h18M8 3v4M16 3v4"/></svg>
      Mese
    </button>
  </nav>

    const BIN_BADGE_SHORT = ["Car", "Org", "Ind", "Pla", "Ver"];
    const BIN_FULL = {
      C: { code: "Car", name: "Carta", icon: "📄", sw: "sw-c" },
      O: { code: "Org", name: "Organico", icon: "🍂", sw: "sw-o" },
      I: { code: "Ind", name: "Indifferenziata", icon: "🗑", sw: "sw-i" },
      P: { code: "Pla", name: "Plastica", icon: "♻", sw: "sw-p" },
      V: { code: "Ver", name: "Verde", icon: "🌿", sw: "sw-v" },
    };
    const DOW_IT = ["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"];
    const DOW_FULL = ["Lunedì", "Martedì", "Mercoledì", "Giovedì", "Venerdì", "Sabato", "Domenica"];
    const MONTH_IT = [
      "Gennaio", "Febbraio", "Marzo", "Aprile", "Maggio", "Giugno",
      "Luglio", "Agosto", "Settembre", "Ottobre", "Novembre", "Dicembre",
    ];
    const BIN_INDEX_INITIAL = ["C", "O", "I", "P", "V"];

    const $ = (id) => document.getElementById(id);

    let viewYear = new Date().getFullYear();
    let viewMonth = new Date().getMonth() + 1;
    let selectedDayKey = null;
    let activeTab = "home";
    /** @type {Map<string, {initials:string, stradaVuota:boolean}>} */
    const dayCache = new Map();

    function ymdKey(y, m, d) {
      return y + "-" + String(m).padStart(2, "0") + "-" + String(d).padStart(2, "0");
    }

    function formatDateIt(y, m, d) {
      const wd = weekdayMondayFirst(y, m, d);
      return DOW_FULL[wd] + " " + d + " " + MONTH_IT[m - 1];
    }

    function initialsToItems(initials) {
      if (!initials || typeof initials !== "string") return [];
      return initials
        .split(".")
        .filter(Boolean)
        .map((p) => {
          const ch = p.charAt(0);
          return BIN_FULL[ch] || { code: "Ris", name: "Rifiuto", icon: "•", sw: "sw-x", ch };
        });
    }

    function setTab(tab) {
      activeTab = tab;
      document.querySelectorAll(".panel").forEach((p) => {
        const on = p.dataset.panel === tab;
        p.classList.toggle("active", on);
        p.hidden = !on;
      });
      document.querySelectorAll("#bottomNav [data-tab]").forEach((btn) => {
        const on = btn.dataset.tab === tab;
        btn.classList.toggle("active", on);
        if (on) btn.setAttribute("aria-current", "page");
        else btn.removeAttribute("aria-current");
      });
      window.scrollTo(0, 0);
    }

    function renderHero(t) {
      const hero = $("hero");
      hero.classList.remove("empty", "street");

      if (!t || !t.year) {
        $("heroTitle").textContent = "Dati non disponibili";
        $("heroWhen").textContent = "—";
        $("heroPickups").innerHTML = "";
        hero.classList.add("empty");
        return;
      }

      $("heroWhen").textContent = formatDateIt(t.year, t.month, t.day);

      if (t.stradaVuota) {
        hero.classList.add("street");
        $("heroTitle").textContent = "Pulizia Strada";
        $("heroPickups").innerHTML = "";
        $("liveLine").textContent = "Pulizia Strada domani";
        return;
      }

      const items = initialsToItems(t.initials || "");
      if (items.length === 0) {
        hero.classList.add("empty");
        $("heroTitle").textContent = "Niente da esporre";
        $("heroPickups").innerHTML = "";
        $("liveLine").textContent = "Nessun ritiro domani";
        return;
      }

      $("heroTitle").textContent =
        items.length === 1
          ? "Metti fuori 1 cassonetto"
          : "Metti fuori " + items.length + " cassonetti";
      $("liveLine").textContent = "Domani: " + items.map((x) => x.name).join(", ");

      const root = $("heroPickups");
      root.innerHTML = "";
      items.forEach((item) => {
        const row = document.createElement("div");
        row.className = "pickup";
        row.innerHTML =
          '<span class="swatch ' +
          item.sw +
          '" aria-hidden="true"></span>' +
          '<span class="name">' +
          item.icon +
          " " +
          item.name +
          "</span>";
        root.appendChild(row);
      });
    }

    function weekdayMondayFirst(y, m, d) {
      const js = new Date(y, m - 1, d).getDay();
      return js === 0 ? 6 : js - 1;
    }

    function daysInMonth(y, m) {
      return new Date(y, m, 0).getDate();
    }

    /** Stessa regola di calendar.h (Sakamoto, 0=dom … 6=sab). */
    function calendarWeekdaySun0(year, month, day) {
      const monthShift = [0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4];
      let y = year;
      if (month < 3) y -= 1;
      return (y + Math.floor(y / 4) - Math.floor(y / 100) + Math.floor(y / 400) + monthShift[month - 1] + day) % 7;
    }

    function isStradaVuotaDay(year, month, day) {
      if (month === 1 || month % 2 === 0) return false;
      if (day > 7) return false;
      return calendarWeekdaySun0(year, month, day) === 1;
    }

    function binInitialFromIndex(binIndex) {
      return BIN_INDEX_INITIAL[binIndex] || "?";
    }

    function collectBinsForYmd(y, m, d) {
      const out = [];
      for (let i = 0; i < CALENDAR_ENTRIES.length; i++) {
        const e = CALENDAR_ENTRIES[i];
        if (e[0] === y && e[1] === m && e[2] === d) {
          const bin = e[3];
          if (bin >= 0 && bin < BIN_INDEX_INITIAL.length) out.push(bin);
        }
      }
      return out;
    }

    function dayInfo(y, m, d) {
      const bins = collectBinsForYmd(y, m, d);
      const initials = bins.map(binInitialFromIndex).join(".");
      return { initials, stradaVuota: isStradaVuotaDay(y, m, d), bins };
    }

    function cacheMonth(y, m) {
      const D = daysInMonth(y, m);
      const out = new Array(D + 1);
      for (let d = 1; d <= D; d++) {
        const info = dayInfo(y, m, d);
        out[d] = info;
        dayCache.set(ymdKey(y, m, d), {
          initials: info.initials,
          stradaVuota: info.stradaVuota,
        });
      }
      return out;
    }

    function tagClassForInitial(ch) {
      switch (ch) {
        case "C": return "tag-c";
        case "O": return "tag-o";
        case "I": return "tag-i";
        case "P": return "tag-p";
        case "V": return "tag-v";
        default: return "tag-x";
      }
    }

    function badgeLabelFromInitial(ch) {
      return (BIN_FULL[ch] && BIN_FULL[ch].code) || "Ris";
    }

    function createBadgeSpan(label, initialForColor, titleExtra) {
      const span = document.createElement("span");
      span.className = "tag " + tagClassForInitial(initialForColor);
      span.textContent = label;
      span.title = titleExtra ? titleExtra + " · " + label : label;
      return span;
    }

    function badgesFromInitialsString(initials) {
      if (!initials || typeof initials !== "string") return null;
      const parts = initials.split(".").filter(Boolean);
      if (parts.length === 0) return null;
      return parts.map((p) => {
        const ch = p.charAt(0);
        return createBadgeSpan(badgeLabelFromInitial(ch), ch, p.length > 1 ? p : "");
      });
    }

    function buildDowHeader() {
      const head = $("calGridHead");
      head.innerHTML = "";
      DOW_IT.forEach((name) => {
        const el = document.createElement("div");
        el.className = "cal-dow";
        el.textContent = name.charAt(0);
        head.appendChild(el);
      });
    }

    function renderMonthGrid(y, m, dayDataArray) {
      const grid = $("calGrid");
      grid.innerHTML = "";
      const D = daysInMonth(y, m);
      const lead = weekdayMondayFirst(y, m, 1);
      const today = new Date();
      const isThisMonth = today.getFullYear() === y && today.getMonth() + 1 === m;
      const todayD = isThisMonth ? today.getDate() : -1;

      for (let i = 0; i < lead; i++) {
        const pad = document.createElement("div");
        pad.className = "cal-cell pad";
        pad.setAttribute("aria-hidden", "true");
        grid.appendChild(pad);
      }

      for (let d = 1; d <= D; d++) {
        const cell = document.createElement("div");
        cell.className = "cal-cell";
        cell.setAttribute("role", "gridcell");
        if (d === todayD) cell.classList.add("today");

        const data = dayDataArray[d];
        const stradaVuota = Boolean(data && data.stradaVuota);

        const num = document.createElement("div");
        num.className = "num";
        num.textContent = String(d);
        cell.appendChild(num);

        const tags = document.createElement("div");
        tags.className = "tags";

        let hasWasteBadge = false;
        if (data) {
          const fromIni = badgesFromInitialsString(data.initials || "");
          if (fromIni) {
            fromIni.forEach((n) => tags.appendChild(n));
            hasWasteBadge = true;
          }
        }

        if (stradaVuota) {
          const car = document.createElement("span");
          car.className = "tag tag-car";
          car.textContent = "🚗";
          car.title = "Pulizia Strada";
          car.setAttribute("aria-label", "Pulizia Strada");
          tags.appendChild(car);
        } else if (!hasWasteBadge) {
          const none = document.createElement("span");
          none.className = "none";
          none.textContent = "—";
          tags.appendChild(none);
        }
        cell.appendChild(tags);
        grid.appendChild(cell);
      }
    }

    function mondayOfWeek(ref) {
      const d = new Date(ref.getFullYear(), ref.getMonth(), ref.getDate());
      const js = d.getDay();
      const offset = js === 0 ? -6 : 1 - js;
      d.setDate(d.getDate() + offset);
      return d;
    }

    function renderWeekStrip() {
      const strip = $("weekStrip");
      strip.innerHTML = "";
      const today = new Date();
      const monday = mondayOfWeek(today);
      if (!selectedDayKey) {
        selectedDayKey = ymdKey(today.getFullYear(), today.getMonth() + 1, today.getDate());
      }

      $("weekMonthHint").textContent =
        MONTH_IT[today.getMonth()].slice(0, 3) + " " + today.getFullYear();

      for (let i = 0; i < 7; i++) {
        const d = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i);
        const y = d.getFullYear();
        const m = d.getMonth() + 1;
        const day = d.getDate();
        const key = ymdKey(y, m, day);
        const cached = dayCache.get(key) || dayInfo(y, m, day);
        dayCache.set(key, { initials: cached.initials, stradaVuota: cached.stradaVuota });
        const isToday =
          y === today.getFullYear() &&
          m === today.getMonth() + 1 &&
          day === today.getDate();

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "day-chip";
        btn.setAttribute("role", "option");
        btn.setAttribute("aria-selected", key === selectedDayKey ? "true" : "false");
        if (isToday) btn.classList.add("today");
        if (key === selectedDayKey) btn.classList.add("selected");

        const items = initialsToItems(cached.initials);
        let dots = items
          .map((it) => '<span class="dot-bin ' + it.sw + '"></span>')
          .join("");
        if (cached.stradaVuota) {
          dots += '<span class="dot-bin sw-car"></span>';
        }

        btn.innerHTML =
          '<span class="dow">' +
          DOW_IT[i] +
          "</span>" +
          '<span class="num">' +
          day +
          "</span>" +
          '<span class="dots">' +
          dots +
          "</span>";
        btn.addEventListener("click", () => {
          selectedDayKey = key;
          renderWeekStrip();
          renderDayDetail(y, m, day);
        });
        strip.appendChild(btn);
      }

      const parts = selectedDayKey.split("-").map(Number);
      renderDayDetail(parts[0], parts[1], parts[2]);

      const selectedEl = strip.querySelector(".day-chip.selected");
      if (selectedEl) {
        selectedEl.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
      }
    }

    function renderDayDetail(y, m, d) {
      const cached = dayCache.get(ymdKey(y, m, d)) || dayInfo(y, m, d);
      const today = new Date();
      const isToday =
        y === today.getFullYear() && m === today.getMonth() + 1 && d === today.getDate();
      const tom = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 1);
      const isTom =
        y === tom.getFullYear() && m === tom.getMonth() + 1 && d === tom.getDate();

      let prefix = formatDateIt(y, m, d);
      if (isToday) prefix = "Oggi · " + prefix;
      else if (isTom) prefix = "Domani · " + prefix;
      $("dayDetailLabel").textContent = prefix;

      const chips = $("dayDetailChips");
      chips.innerHTML = "";

      const items = initialsToItems(cached.initials);
      if (cached.stradaVuota) {
        const c = document.createElement("span");
        c.className = "chip sw-car";
        c.innerHTML = '<span class="mark sw-car"></span>Pulizia Strada';
        chips.appendChild(c);
      }
      items.forEach((it) => {
        const c = document.createElement("span");
        c.className = "chip " + (it.sw || "sw-x");
        c.innerHTML =
          '<span class="mark ' + it.sw + '"></span>' + it.icon + " " + it.name;
        chips.appendChild(c);
      });

      if (!cached.stradaVuota && items.length === 0) {
        const p = document.createElement("p");
        p.className = "empty-day";
        p.textContent = "Nessun ritiro in questo giorno.";
        chips.appendChild(p);
      }
    }

    function loadMonth() {
      const title = MONTH_IT[viewMonth - 1] + " " + viewYear;
      $("calTitle").textContent = title;
      $("calTitleShort").textContent = MONTH_IT[viewMonth - 1].slice(0, 3) + " ▸";
      const dataByDay = cacheMonth(viewYear, viewMonth);
      renderMonthGrid(viewYear, viewMonth, dataByDay);
      renderWeekStrip();
    }

    function ensureWeekMonthsCached() {
      const today = new Date();
      const monday = mondayOfWeek(today);
      const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
      const months = new Set();
      months.add(monday.getFullYear() + "-" + (monday.getMonth() + 1));
      months.add(sunday.getFullYear() + "-" + (sunday.getMonth() + 1));
      for (const key of months) {
        const [y, m] = key.split("-").map(Number);
        cacheMonth(y, m);
      }
      renderWeekStrip();
    }

    function shiftMonth(delta) {
      viewMonth += delta;
      if (viewMonth > 12) {
        viewMonth = 1;
        viewYear++;
      } else if (viewMonth < 1) {
        viewMonth = 12;
        viewYear--;
      }
    }

    function loadTomorrowHero() {
      const tom = new Date();
      tom.setDate(tom.getDate() + 1);
      const y = tom.getFullYear();
      const m = tom.getMonth() + 1;
      const d = tom.getDate();
      const info = dayInfo(y, m, d);
      renderHero({
        year: y,
        month: m,
        day: d,
        initials: info.initials,
        stradaVuota: info.stradaVuota,
        bins: info.bins,
      });
    }

    $("btnCalPrev").addEventListener("click", () => {
      shiftMonth(-1);
      loadMonth();
    });
    $("btnCalNext").addEventListener("click", () => {
      shiftMonth(1);
      loadMonth();
    });
    $("btnCalToday").addEventListener("click", () => {
      const t = new Date();
      viewYear = t.getFullYear();
      viewMonth = t.getMonth() + 1;
      loadMonth();
    });

    $("btnGotoCal").addEventListener("click", () => setTab("cal"));

    document.querySelectorAll("#bottomNav [data-tab]").forEach((btn) => {
      btn.addEventListener("click", () => setTab(btn.dataset.tab));
    });

    buildDowHeader();
    loadTomorrowHero();
    ensureWeekMonthsCached();
    loadMonth();
  </script>
